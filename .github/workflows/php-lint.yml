name: PHP lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: "! LC_ALL=C grep -rnP '[^\\x00-\\x7F]' wp-cli/"
